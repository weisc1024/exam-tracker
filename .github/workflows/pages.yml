name: 部署 HTML 工作台到 GitHub Pages

on:
  # 每天 06:30 抓取完成后触发
  workflow_run:
    workflows: ["每日抓取考试公告"]
    types: [completed]
  # 允许手动触发
  workflow_dispatch:

# 避免无限循环：跳过由 Pages 自身触发的运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python（用于把 exams.json 拷贝到 web/ 目录）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 把数据拷贝到 web/
        run: |
          mkdir -p web
          cp data/exams.json web/exams.json
          echo "✓ exams.json 已拷贝到 web/"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 输出访问地址
        if: steps.deploy.outputs.page_url
        run: echo "🌐 工作台已部署：${{ steps.deploy.outputs.page_url }}"