name: 每日抓取考试公告

on:
  # 北京时间每天 06:30（UTC 22:30 前一天）
  schedule:
    - cron: '30 22 * * *'
  # 允许手动触发（Actions → Run workflow）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不推送"
        required: false
        default: "false"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip || true
          pip install --retries 3 --timeout 60 -r requirements.txt || echo "⚠ 部分依赖安装失败，将以空抓取模式继续"

      - name: 抓取 + 推送
        continue-on-error: true
        env:
          RSSHUB_INSTANCE: ${{ secrets.RSSHUB_INSTANCE || 'https://rsshub.umzzz.com' }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          echo "=== RSSHub 实例: $RSSHUB_INSTANCE ==="
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN: 仅抓取，不推送 ==="
            python -c "
          import sys; sys.path.insert(0, 'scripts')
          from fetch_rss import fetch_all, filter_relevant
          raw = fetch_all()
          rel = filter_relevant(raw)
          print(f'共 {len(raw)} 条原始，{len(rel)} 条相关')
          " || echo "抓取失败，跳过"
          else
            python scripts/fetch_rss.py || echo "抓取失败，将继续到下一步"

      - name: 提交变更
        if: always()
        run: |
          git config user.name "exam-tracker-bot"
          git config user.email "bot@example.com"
          git add -A || true
          if git diff --cached --quiet; then
            echo "无变更需要提交"
          else
            git commit -m "chore: 更新考试公告 $(date +%F)" || echo "提交失败"
            git push || echo "推送失败"
          fi

      - name: 健康检查
        if: always()
        run: |
          echo "=== 当前 exams.json 状态 ==="
          if [ -f data/exams.json ]; then
            echo "✓ exams.json 存在，$(python3 -c "import json; print(len(json.load(open('data/exams.json'))))") 个考试项目"
          else
            echo "✗ exams.json 不存在！"
          fi
          echo "=== 完成 ==="